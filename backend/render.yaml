services:
  - type: web
    name: smart-bottle-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn backend.wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: APP_ENVIRONMENT
        value: "production"
      - key: DEPLOY_PROVIDER
        value: "render"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: CSRF_TRUSTED_ORIGINS
        value: ""
      - key: DATABASE_SSL_REQUIRE
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEVICE_INGEST_TOKEN
        generateValue: true
      - key: RASPBERRY_PI_BASE_URL
        value: "http://192.168.18.181:5001"
      - key: PUBLIC_APP_URL
        value: ""
      - key: ALLOW_INSECURE_DEVICE_INGEST
        value: "False"
      - key: ALLOW_PUBLIC_DASHBOARD_RESET
        value: "False"
      - key: ALLOW_PUBLIC_ADMIN_DASHBOARD
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-bottle-db
          property: connectionString

databases:
  - name: smart-bottle-db
    plan: free
